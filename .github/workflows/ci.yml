name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atendezap
          POSTGRES_PASSWORD: atendezap_local
          POSTGRES_DB: atendezap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atendezap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Credenciais do Postgres efêmero da CI (não são segredos).
      DATABASE_URL: postgresql://atendezap:atendezap_local@localhost:5432/atendezap?schema=public
      TEST_DATABASE_URL: postgresql://atendezap:atendezap_local@localhost:5432/atendezap_test?schema=public
      # Segredo só da CI (banco efêmero, sem dados reais). Em produção, use um segredo do provedor.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (gera o Prisma Client)
        run: npm ci

      - name: Criar banco de testes
        run: PGPASSWORD=atendezap_local psql -h localhost -U atendezap -c "CREATE DATABASE atendezap_test"

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Testes unitários e de integração
        run: npm test

      - name: Build de produção
        run: npm run build

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
